name: Update most-read guide

on:
  schedule:
    - cron: "17 5 * * *"   # every day at ~05:17 UTC
  workflow_dispatch: {}      # lets you run it manually from the Actions tab

permissions:
  contents: write            # allows committing featured.json back to the repo
  id-token: write            # required for keyless Workload Identity Federation (OIDC)

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Authenticate to Google (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Query GA4 and write featured.json
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: node update-featured.mjs

      - name: Commit featured.json if it changed
        run: |
          if ! git diff --quiet -- featured.json; then
            git config user.name "featured-bot"
            git config user.email "actions@users.noreply.github.com"
            git add featured.json
            git commit -m "Update most-read guide"
            git push
          else
            echo "No change to featured guide."
          fi

name: Update most-read guide

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Authenticate to Google (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Query GA4 and write featured.json
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: node update-featured.mjs

      - name: Commit featured.json if it changed
        run: |
          git config user.name "featured-bot"
          git config user.email "actions@users.noreply.github.com"
          git add featured.json
          if git diff --cached --quiet; then
            echo "No change to featured guide."
          else
            git commit -m "Update most-read guide"
            git push
          fi
